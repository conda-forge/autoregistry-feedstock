schema_version: 1

context:
  name: autoregistry
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/autoregistry-${{ version }}.tar.gz
  sha256: 66c8273474a657d548b80772f03fa53bffef1aa913825c5b69f047331e7230d5

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatchling
    - hatch-vcs
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - autoregistry
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Automatic registry design-pattern for mapping names to functionality.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/BrianPugh/autoregistry

extra:
  recipe-maintainers:
    - thewchan
